<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TermFinale · 新建任务</title>
<style>
:root{--ink:#17201d;--mut:#6d7770;--line:#e3e5df;--paper:#f6f5f0;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:48px 26px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.brand{font-weight:700;text-decoration:none;color:var(--ink)}.back{font-size:13px;color:var(--mut);text-decoration:none}
h1{font-size:36px;letter-spacing:-.02em;margin:0 0 8px}.lead{color:var(--mut);margin:0 0 28px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px}.row input,.row select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;background:#fff}
.row input.name{flex:1}.row input.pages{width:110px}.row select{width:140px}
button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}button.small{padding:6px 10px;font-size:13px}
.muted{color:var(--mut);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metric b{display:block;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}th,td{text-align:left;border-top:1px solid var(--line);padding:8px 4px}th{color:var(--mut);font-weight:500}
pre{background:#f0f1eb;border-radius:12px;padding:14px;overflow:auto;font-size:12px}
.hidden{display:none}
@media(max-width:720px){.grid{grid-template-columns:1fr}.row{flex-wrap:wrap}.row input.name{min-width:100%}}
</style></head><body><div class="wrap">
<div class="top"><a class="brand" href="/">TermFinale</a><a class="back" href="/modules">模块验收 →</a></div>
<h1>新建任务</h1><p class="lead">先估算，再预览 2 页，确认后才运行。多个文件按各自的页数计算，不合并页数。</p>
<div class="panel"><div class="row"><strong style="width:48px">文件</strong><span class="muted">页数</span></div>
<div id="files"></div><datalist id="artifactList"></datalist><button class="ghost small" id="add">+ 添加文件</button>
<div class="row" style="margin-top:16px"><label>模式</label><select id="mode"><option value="main">讲大部分</option><option value="outline">只讲大框</option><option value="full">讲全部</option></select>
<label>并行</label><select id="workers"><option>2</option><option>1</option><option>3</option><option>4</option></select>
<label>预览页</label><select id="preview"><option>2</option><option>1</option><option>3</option></select></div>
<div style="display:flex;gap:10px;margin-top:14px"><button id="estimate">估算时间与成本</button><span id="msg" class="muted"></span></div></div>
<div class="panel hidden" id="result"><h2 style="font-size:18px;margin:0 0 8px">估算结果</h2><div class="grid" id="metrics"></div><div id="table"></div>
<div class="row" style="margin-top:16px"><button id="create">创建任务</button><button class="ghost" id="previewBtn">现生成前 2 页预览</button><button class="ghost" id="confirmBtn">确认并运行</button></div>
<div class="muted" id="jobline"></div><div id="previewLink" class="muted" style="margin-top:8px"></div></div>
<div class="panel hidden" id="eventsPanel"><h2 style="font-size:18px;margin:0 0 8px">任务进度</h2><div id="events" class="muted" style="font-size:13px"></div></div>
<div class="panel hidden" id="debug"><pre id="json"></pre></div>
</div>
<script>
let job=null;
const files=document.getElementById('files');
function addRow(name='',pages=40){const d=document.createElement('div');d.className='row file';d.innerHTML='<input class="name" placeholder="文件名" value="'+name+'"><input class="pages" type="number" min="1" value="'+pages+'"><input class="artifact" placeholder="artifact_id（可选）" list="artifactList"><button class="ghost small">删除</button>';d.querySelector('button').onclick=()=>d.remove();files.appendChild(d);}
addRow('模电教材',50);addRow('真题',10);
document.getElementById('add').onclick=()=>addRow();
fetch('/api/artifacts').then(r=>r.json()).then(rows=>{document.getElementById('artifactList').innerHTML=rows.map(x=>'<option value="'+x.id+'">'+x.title+'</option>').join('');}).catch(()=>{});
function specs(){return [...files.querySelectorAll('.file')].map(x=>({name:x.querySelector('.name').value||'未命名',pages:Math.max(1,parseInt(x.querySelector('.pages').value||'1')),artifact_id:x.querySelector('.artifact').value}));}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});if(!r.ok)throw new Error(await r.text());return r.json();}
document.getElementById('estimate').onclick=async()=>{try{const p=await post('/api/job/estimate',{files:specs(),mode:mode.value,parallel_workers:parseInt(workers.value),preview_pages:parseInt(preview.value)});window.plan=p;result.classList.remove('hidden');metrics.innerHTML='<div class="metric"><span class="muted">总时间</span><b>'+p.total_minutes+' 分</b></div><div class="metric"><span class="muted">总成本</span><b>¥'+p.total_cost_cny+'</b></div><div class="metric"><span class="muted">需要确认</span><b>'+(p.requires_confirm?'是':'否')+'</b></div>';table.innerHTML='<table><tr><th>文件</th><th>页数</th><th>覆盖率</th><th>时间</th><th>成本</th><th>预览</th></tr>'+p.files.map(f=>'<tr><td>'+f.name+'</td><td>'+f.pages+'</td><td>'+Math.round(f.coverage*100)+'%</td><td>'+f.minutes+' 分</td><td>¥'+f.cost_cny+'</td><td>'+f.preview_range+'</td></tr>').join('')+'</table>';msg.textContent='估算完成';}catch(e){msg.textContent='估算失败：'+e.message;}};
document.getElementById('create').onclick=async()=>{try{job=await post('/api/job/create',{files:specs(),mode:mode.value,parallel_workers:parseInt(workers.value),preview_pages:parseInt(preview.value)});jobline.textContent='任务 '+job.job_id+' · '+job.stage;previewLink.textContent='预览前需先调用“现生成前 2 页预览”';eventsPanel.classList.remove('hidden');events.innerHTML='';const es=new EventSource('/api/job/'+job.job_id+'/events/stream');es.addEventListener('job',ev=>{const x=JSON.parse(ev.data);const div=document.createElement('div');div.textContent=x.stage+' · '+(x.message||'');events.appendChild(div);});es.addEventListener('end',()=>es.close());}catch(e){jobline.textContent='创建失败：'+e.message;}};
document.getElementById('previewBtn').onclick=async()=>{if(!job){jobline.textContent='先创建任务';return;}try{const aid=prompt('演示用 artifact_id','gen_100p_pair_21_22');if(!aid)return;job=await post('/api/job/'+job.job_id+'/preview',{artifact_id:aid,pages:2,generate:true});previewLink.innerHTML='<a href="/api/job/'+job.job_id+'/preview.pdf" target="_blank">打开前 2 页预览 PDF</a> · '+job.stage;}catch(e){previewLink.textContent='预览失败：'+e.message;}};
document.getElementById('confirmBtn').onclick=async()=>{if(!job){jobline.textContent='先创建任务';return;}try{job=await post('/api/job/'+job.job_id+'/confirm');await post('/api/job/'+job.job_id+'/start');jobline.textContent='任务 '+job.job_id+' · 已确认并启动 worker';}catch(e){jobline.textContent='确认失败：'+e.message;}};
</script></body></html>

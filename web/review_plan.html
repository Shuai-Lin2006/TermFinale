<script src="assets/app.js?v=18"></script>
<script src="assets/i18n.js?v=1"></script><script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function card(html){return '<article class="card course" style="margin-bottom:12px">'+html+'</article>'}
  Promise.all([fetch('/api/mistakes').then(r=>r.json()), fetch('/api/courses').then(r=>r.json())]).then(function(res){
    var ms=res[0]||[], cs=res[1]||[];
    var due=ms.filter(function(m){return m.due && !m.mastered});
    var up=cs.slice().sort(function(a,b){return a.days_left-b.days_left});
    var out='';
    out+='<div class="section-head"><h2>今天该复习</h2><div class="line"></div><span class="tiny muted">'+due.length+' 题</span></div>';
    out+=due.length?due.map(function(m){return card('<div class="course-top"><span class="chip">'+m.course+'</span><span class="tiny muted">第 '+(m.stage+1)+' 轮</span></div><p style="margin:10px 0;line-height:1.8">'+m.question+'</p><a class="btn sm" href="practice.html">去复习</a>')}).join(''):'<div class="card" style="padding:26px;text-align:center" class="muted">今天没有到期错题，休息一下。</div>';
    out+='<div class="section-head"><h2>最近考试</h2><div class="line"></div></div>';
    out+=up.length?up.map(function(c){return card('<div class="course-top"><span class="chip">'+(c.days_left<=3?'临近考试':'进行中')+'</span><span class="tiny muted">'+c.days_left+' 天后</span></div><h3>'+c.name+'</h3><div class="meta">'+c.materials+' 份资料 · '+c.generated+' 份已生成</div><div class="course-foot"><span>'+(c.materials?'资料就绪':'还没有资料')+'</span><a class="btn sm" href="'+(c.materials?'reader.html?course='+c.id:'upload.html?course='+c.id)+'">'+(c.materials?'打开讲义':'上传资料')+'</a></div>')}).join(''):'<div class="card" style="padding:26px;text-align:center"><span class="muted">还没有课程</span></div>';
    $('content').innerHTML=out;
    $('sub').textContent='共 '+due.length+' 道到期错题 · '+cs.length+' 门课';
  }).catch(function(){ $('sub').textContent='本地服务未启动'; });
})();
</script></body></html>

<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="assets/appearance-boot.js?v=2"></script>
<title>上传资料 · TermFinale</title>
<link rel="stylesheet" href="assets/app.css?v=23">
<link rel="stylesheet" href="assets/premium.css?v=4">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13a9 9 0 1 1-10-10 7 7 0 0 0 10 10Z"/></symbol>
</svg>

<div class="app">
  <aside class="rail">
    <div class="brand"><span class="brand-mark">TF</span><div><div class="brand-name">TermFinale</div><div class="brand-sub">期末复习工作台</div></div></div>
    <nav class="nav"></nav>
    <div class="rail-foot"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <span class="eyebrow">COURSE</span>
      <select class="select" id="courseSelect" style="min-width:190px"></select>
      <div class="spacer"></div>
      <span class="chip" id="apiState">连接中…</span>
      <a class="btn ghost sm" id="editCourse" href="courses.html">编辑课程</a>
      <a class="btn primary sm" id="goGenerate" href="generate.html">去生成<svg class="icon sm"><use href="#i-arrow"/></svg></a>
    </header>

    <div class="page">
      <div class="page-head">
        <div>
          <div class="eyebrow">UPLOAD</div>
          <h1 class="page-title">上传资料</h1>
          <div class="page-sub" id="sub">资料按课程独立保存，不会跨课共用。PDF / 扫描件 / PPTX / Word / 照片 / 音频。</div>
        </div>
      </div>

      <div class="upload-grid">
        <section class="card upload-card">
          <div class="drop" id="drop">
            <div class="drop-icon"><svg class="icon"><use href="#i-upload"/></svg></div>
            <b>拖文件到这里，或点击选择</b>
            <span>支持多选 · 单个文件不超过 500MB</span>
            <div class="drop-formats">
              <span class="chip">PDF</span><span class="chip">PPTX</span><span class="chip">DOCX</span>
              <span class="chip">图片</span><span class="chip">音频</span>
            </div>
            <input type="file" id="fileInput" multiple hidden
                   accept=".pdf,.pptx,.docx,.txt,.md,.jpg,.jpeg,.png,.webp,.mp3,.wav,.m4a,.aac,.flac,.ogg,.amr">
          </div>
          <div id="queue" class="upload-queue"></div>
          <div class="tf-mini" style="margin-top:12px">扫描件/照片会先 OCR；解析结果会缓存，重复生成不重复花钱。</div>
        </section>

        <aside>
          <section class="card" style="padding:16px 18px;margin-bottom:14px">
            <div class="tf-section-head" style="margin:0 0 10px">
              <h2 style="font-size:15px">已有资料</h2>
              <span class="tf-mini" id="count">0 份</span>
            </div>
            <div id="materials"><div class="tiny muted">加载中…</div></div>
          </section>
          <section class="card" style="padding:16px 18px">
            <div class="eyebrow" style="margin-bottom:8px">Notes</div>
            <p class="note" style="margin:0">资料越多，讲义越全；只有一份也能生成。缺页会在阅读器里标出来，不会假装完整。</p>
          </section>
        </aside>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="assets/app.js?v=23"></script>
<script src="assets/i18n.js?v=2"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var toast = window.__toast || function(){};
  var courseId = null;
  var MAX = 500 * 1024 * 1024;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function syncEditLink(){
    var el = $('editCourse'); if(!el) return;
    el.href = 'courses.html?edit=' + encodeURIComponent($('courseSelect').value || '');
  }
  function loadCourses(){
    fetch('/api/courses').then(function(r){ return r.json(); }).then(function(list){
      $('apiState').textContent = '已连接';
      var sel = $('courseSelect'); sel.innerHTML = '';
      (list || []).forEach(function(c){
        var o = document.createElement('option');
        o.value = c.id; o.textContent = c.name + ' · ' + c.days_left + ' 天后考试';
        sel.appendChild(o);
      });
      if(!list || !list.length){
        sel.innerHTML = '<option value="">还没有课程</option>';
        $('materials').innerHTML = '<div class="tf-mini">先新建一门课，再上传资料。</div>';
        $('goGenerate').style.display = 'none';
        return;
      }
      var want = new URLSearchParams(location.search).get('course');
      if(want) sel.value = want;
      selectCourse(sel.value);
    }).catch(function(){
      $('apiState').textContent = '未连接';
      $('materials').innerHTML = '<div class="tf-mini" style="color:var(--danger)">本地服务未启动</div>';
    });
  }
  function selectCourse(id){
    courseId = id;
    $('goGenerate').href = 'generate.html?course=' + id;
    $('goGenerate').style.display = '';
    syncEditLink();
    loadMaterials();
  }
  function loadMaterials(){
    if(!courseId) return;
    fetch('/api/courses/' + courseId).then(function(r){ return r.json(); }).then(function(c){
      var box = $('materials');
      var mats = c.materials || [];
      $('count').textContent = mats.length + ' 份';
      if(!mats.length){
        box.innerHTML = '<div class="tf-mini">还没有资料，先上传一份。</div>';
        return;
      }
      box.innerHTML = mats.map(function(m){
        var ext = (m.filename.split('.').pop() || '').toUpperCase().slice(0, 4);
        return '<div class="file-row">'
          + '<span class="badge">' + esc(ext) + '</span>'
          + '<span class="grow" title="' + esc(m.filename) + '">' + esc(m.filename) + '</span>'
          + '<span class="tf-mini">' + (m.size_kb || 0) + ' KB</span>'
          + '<button class="btn ghost sm" data-del="' + m.id + '" title="删除">'
          + '<svg class="icon sm"><use href="#i-trash"/></svg></button></div>';
      }).join('');
      box.querySelectorAll('[data-del]').forEach(function(b){
        b.addEventListener('click', function(){
          if(!confirm('删除这份资料？原文件不会从桌面删除。')) return;
          fetch('/api/courses/' + courseId + '/materials/' + b.dataset.del, {method:'DELETE'})
            .then(function(r){ if(!r.ok) throw new Error(); loadMaterials(); toast('已删除'); })
            .catch(function(){ toast('删除失败，请重试'); });
        });
      });
    }).catch(function(){
      $('materials').innerHTML = '<div class="tf-mini" style="color:var(--danger)">资料加载失败</div>';
    });
  }
  function uploadOne(file, row, bar){
    return new Promise(function(resolve){
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/courses/' + courseId + '/materials');
      xhr.upload.onprogress = function(e){
        if(e.lengthComputable) bar.style.width = Math.round(e.loaded / e.total * 100) + '%';
      };
      xhr.onload = function(){
        if(xhr.status >= 200 && xhr.status < 300){
          row.dataset.ok = '1';
          row.querySelector('.up-state').textContent = '完成';
          bar.style.width = '100%';
        } else {
          row.classList.add('up-error');
          row.querySelector('.up-state').textContent = '失败';
          row.title = '上传失败（HTTP ' + xhr.status + '）';
        }
        resolve();
      };
      xhr.onerror = function(){
        row.classList.add('up-error');
        row.querySelector('.up-state').textContent = '网络错误';
        resolve();
      };
      var fd = new FormData(); fd.append('file', file);
      xhr.send(fd);
    });
  }
  function handleFiles(files){
    if(!courseId){ toast('先选择课程'); return; }
    var queue = $('queue');
    var tasks = [];
    Array.prototype.forEach.call(files, function(file){
      if(file.size > MAX){
        toast(file.name + ' 超过 500MB，已跳过');
        return;
      }
      var row = document.createElement('div');
      row.className = 'up-item';
      row.innerHTML = '<span class="up-name" title="' + esc(file.name) + '">' + esc(file.name) + '</span>'
        + '<span class="up-state">上传中</span><span class="track"><i></i></span>';
      queue.appendChild(row);
      tasks.push(uploadOne(file, row, row.querySelector('i')));
    });
    Promise.all(tasks).then(function(){
      setTimeout(loadMaterials, 300);
      if(tasks.length) toast('上传完成');
    });
  }

  $('drop').addEventListener('click', function(){ $('fileInput').click(); });
  $('fileInput').addEventListener('change', function(e){ handleFiles(e.target.files); e.target.value = ''; });
  ['dragenter','dragover'].forEach(function(ev){
    $('drop').addEventListener(ev, function(e){ e.preventDefault(); $('drop').classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    $('drop').addEventListener(ev, function(e){ e.preventDefault(); $('drop').classList.remove('over'); });
  });
  $('drop').addEventListener('drop', function(e){ if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
  $('courseSelect').addEventListener('change', function(){ selectCourse(this.value); syncEditLink(); });

  loadCourses();
})();
</script>
<script src="assets/appearance.js?v=2"></script>
<script src="assets/ai-global.js?v=2"></script>
</body>
</html>

  <main class="main">
    <header class="topbar">

      <button class="btn ghost sm" id="themeBtn2"><svg class="icon sm"><use href="#i-moon"/></svg></button>

<div class="modal-mask" id="courseModal">
  <div class="modal">
    <h3 id="modalTitle">新建课程</h3>
    <p class="sub">这些信息会影响讲义的讲法和紧迫度</p>
    <div class="field"><label>课程名</label><input id="fName" placeholder="例如：物理化学"></div>
    <div class="field-row">
      <div class="field"><label>学校层次</label>
        <select id="fSchool"><option>985</option><option>211</option><option selected>一本</option><option>二本</option><option>专科</option></select></div>
      <div class="field"><label>专业</label><input id="fMajor" placeholder="环境工程"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>学分</label><input id="fCredits" type="number" min="0.5" max="8" step="0.5" value="3"></div>
      <div class="field"><label>剩余天数</label><input id="fDays" type="number" value="7"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>目标分数</label><input id="fTarget" type="number" value="80"></div>
      <div class="field"><label>自设难度（这门课）</label>
        <select id="fSelfDiff"><option value="1">1 · 很容易</option><option value="2">2 · 比较简单</option>
          <option value="3" selected>3 · 常规期末</option><option value="4">4 · 比较难</option><option value="5">5 · 很难</option></select></div>
    </div>
    <div class="field"><label>你的基础（这门课）</label>
      <select id="fFoundation"><option value="1">1 · 基础很好</option><option value="2">2 · 基础还行</option>
        <option value="3" selected>3 · 基础一般</option><option value="4">4 · 基础较弱</option><option value="5">5 · 基础很弱</option></select></div>
    <label class="tiny" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="fMajorFlag" checked style="accent-color:var(--brand)"> 这是专业课
    </label>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="assets/app.js?v=18"></script>
<script>
(function(){
  var list = document.getElementById('courseList');
  var empty = document.getElementById('empty');
  var state = document.getElementById('apiState');
  var sub = document.getElementById('subtitle');

  function skeleton(){
    list.innerHTML = [1,2,3].map(function(){
      return '<article class="card course" style="opacity:.6"><div class="bar" style="width:40%;height:14px"></div>'+
             '<div class="bar" style="width:70%;height:22px;margin-top:16px"></div>'+
             '<div class="bar" style="width:55%;height:12px;margin-top:12px"></div>'+
             '<div class="bar" style="width:100%;height:8px;margin-top:18px"></div></article>';
    }).join('');
  }
  skeleton();

  var editingId = null;

  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function card(c){
    var soon = c.days_left <= 3;
    var ready = c.materials > 0 && c.materials_ok === c.materials;
    var p = c.generated ? Math.min(92, 24 + c.generated * 12) : 6;
    return '<article class="tf-course">'+
      '<div class="tf-course-top"><span class="chip'+(soon?' accent':'')+'">'+(soon?'临近考试':'进行中')+'</span>'+
      '<span style="display:flex;gap:2px">'+
      '<button class="btn ghost sm" data-edit="'+c.id+'" title="编辑"><svg class="icon sm"><use href="#i-edit"/></svg></button>'+
      '<button class="btn ghost sm" data-del="'+c.id+'" title="删除"><svg class="icon sm"><use href="#i-trash"/></svg></button>'+
      '</span></div>'+
      '<h3>'+esc(c.name)+'</h3>'+
      '<div class="meta"><span>'+c.days_left+' 天后考试</span><span>'+c.materials+' 份资料</span><span>'+c.generated+' 份生成</span></div>'+
      '<div class="spacer"></div>'+
      '<div class="bar" style="height:4px"><i style="width:'+p+'%"></i></div>'+
      '<div class="tf-course-foot"><span class="tf-mini">'+(ready?'资料就绪':'资料缺失')+'</span>'+
      '<span style="display:flex;gap:6px"><a class="btn ghost sm" href="upload.html?course='+c.id+'">资料</a>'+
      '<a class="btn ghost sm" href="generate.html?course='+c.id+'">生成</a>'+
      '<a class="btn sm" href="course_detail.html?course='+c.id+'">打开</a></span></div>'+
      '</article>';
  }

  function load(){
    fetch('/api/courses').then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        state.textContent = '已连接';
        sub.textContent = data.length ? ('共 '+data.length+' 门课，最近考试在 '+Math.min.apply(null,data.map(function(c){return c.days_left}))+' 天后') : '还没有课程';
        if(!data.length){ list.innerHTML=''; empty.style.display='block'; return; }
        empty.style.display='none';
        list.innerHTML = data.map(card).join('');
        list.querySelectorAll('[data-edit]').forEach(function(b){
          b.addEventListener('click', function(){ openModal(data.filter(function(c){return c.id==b.dataset.edit;})[0]); });
        });
        applyFilter();
        list.querySelectorAll('[data-del]').forEach(function(b){
          b.addEventListener('click', function(){
            if(!confirm('删除这门课？课程资料和已生成文件不会删除，但课程记录会消失。')) return;
            fetch('/api/courses/'+b.dataset.del,{method:'DELETE'}).then(function(){ load(); if(window.__toast) window.__toast('已删除'); });
          });
        });
      })
      .catch(function(e){
        state.textContent = '未连接';
        state.style.color = 'var(--danger)';
        sub.textContent = '本地服务未启动，先运行 python server/app.py';
        list.innerHTML = '<article class="card course" style="grid-column:1/-1"><b>无法连接本地服务</b>'+
          '<p class="muted" style="margin:6px 0 0">在项目目录执行 <code>python server/app.py</code>，然后刷新本页。</p></article>';
      });
  }

  function applyFilter(){
    var q = (document.getElementById('courseSearch').value || '').trim().toLowerCase();
    Array.prototype.forEach.call(list.children, function(card){
      card.style.display = !q || card.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
    });
  }
  document.getElementById('courseSearch').addEventListener('input', applyFilter);

  function openModal(c){
    editingId = c ? c.id : null;
    if(!c){
      fetch('/api/profile').then(function(r){return r.json();}).then(function(p){
        var f=document.getElementById('fMajor');
        if(f && !f.value && p.major) f.value=p.major;
      }).catch(function(){});
    }
    document.getElementById('modalTitle').textContent = c ? '编辑课程' : '新建课程';
    document.getElementById('fName').value = c ? c.name : '';
    document.getElementById('fSchool').value = c ? c.school : '一本';
    document.getElementById('fMajor').value = c ? c.major : '';
    document.getElementById('fCredits').value = c ? c.credits : 3;
    document.getElementById('fDays').value = c ? c.days_left : 7;
    document.getElementById('fTarget').value = c ? c.target_score : 80;
    document.getElementById('fSelfDiff').value = c ? c.difficulty : 3;
    document.getElementById('fFoundation').value = c ? (c.foundation || 3) : 3;
    document.getElementById('fMajorFlag').checked = c ? c.is_major : true;
    document.getElementById('courseModal').classList.add('show');
  }
  function closeModal(){ document.getElementById('courseModal').classList.remove('show'); }

  function save(){
    var payload = {
      name: document.getElementById('fName').value.trim(),
      school_level: document.getElementById('fSchool').value,
      major: document.getElementById('fMajor').value.trim() || '未知',
      credits: Math.max(0.5, Math.min(8, parseFloat(document.getElementById('fCredits').value) || 3)),
      days_left: parseInt(document.getElementById('fDays').value) || 7,
      target_score: parseInt(document.getElementById('fTarget').value) || 80,
      self_difficulty: parseInt(document.getElementById('fSelfDiff').value) || 3,
      foundation: parseInt(document.getElementById('fFoundation').value) || 3,
      is_major: document.getElementById('fMajorFlag').checked
    };
    if(!payload.name){ if(window.__toast) window.__toast('课程名不能为空'); return; }
    var url = editingId ? '/api/courses/' + editingId : '/api/courses';
    fetch(url, { method: editingId ? 'PATCH' : 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(function(r){ if(!r.ok) throw new Error(); closeModal(); load(); if(window.__toast) window.__toast('已保存'); })
      .catch(function(){ if(window.__toast) window.__toast('保存失败'); });
  }

  document.querySelectorAll('[data-new]').forEach(function(b){ b.addEventListener('click', function(){ openModal(null); }); });
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', save);
  document.getElementById('courseModal').addEventListener('click', function(e){ if(e.target === this) closeModal(); });
  load();
  var _edit = new URLSearchParams(location.search).get('edit');
  if(_edit){ fetch('/api/courses/'+_edit).then(function(r){return r.json();}).then(function(c){ if(c) openModal(c); }); }
  else if(new URLSearchParams(location.search).get('new') === '1'){ openModal(null); }
})();
</script>
  <script src="assets/i18n.js?v=1"></script>

<div id="filesModal" style="display:none;position:fixed;inset:0;background:rgba(20,20,20,.42);z-index:2000;align-items:center;justify-content:center">
  <div style="background:var(--paper);border-radius:14px;width:min(560px,90vw);max-height:80vh;overflow:auto;padding:22px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0">生成物</h3><button class="btn ghost sm" id="closeFiles">关闭</button>
    </div>
    <div id="filesList" class="tiny muted">加载中…</div>
  </div>
</div>


<script>
(function(){
  var modal=document.getElementById('filesModal'), list=document.getElementById('filesList');
  var labels={guide:'讲义',extract:'提取',exam:'试卷',analysis:'逻辑分析'};
  document.addEventListener('click', function(e){
    var b=e.target.closest('[data-files]'); if(!b) return;
    modal.style.display='flex'; list.textContent='加载中…';
    fetch('/api/courses/'+b.dataset.files+'/files').then(function(r){return r.json();}).then(function(d){
      if(!d.files || !d.files.length){ list.innerHTML='<p>还没有生成物</p>'; return; }
      list.innerHTML=d.files.map(function(f){
        return '<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)">'+
          '<a href="reader.html?course='+d.course.id+'&file='+f.id+'" style="color:var(--ink);text-decoration:none">'+
          '<b>'+(labels[f.type]||f.type)+'</b> · '+f.filename+'</a>'+
          '<span class="tiny muted">'+(f.exists?'可打开':'文件缺失')+'</span></div>';
      }).join('');
    }).catch(function(){ list.textContent='加载失败'; });
  });
  document.getElementById('closeFiles').addEventListener('click',function(){ modal.style.display='none'; });
  modal.addEventListener('click',function(e){ if(e.target===modal) modal.style.display='none'; });
})();
</script>

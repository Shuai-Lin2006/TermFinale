<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("tf-theme")||"dark"}catch(e){}</script>
<title>阅读 · TermFinale</title>
<link rel="stylesheet" href="assets/app.css?v=18">
<link rel="stylesheet" href="assets/premium.css?v=1">
<link rel="stylesheet" href="assets/katex/katex.inline.css">
<script src="assets/katex/katex.min.js"></script>
<script src="assets/katex/auto-render.min.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.4 1 2.5h6c0-1.1.3-1.8 1-2.5A6 6 0 0 0 12 3Z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="m14 6 4 4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-word" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 16h10v5H7z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13a9 9 0 1 1-10-10 7 7 0 0 0 10 10Z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7Z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<div class="reader">
  <aside class="toc">
    <div style="display:flex;align-items:center;gap:8px;padding:0 8px 14px">
      <a class="btn ghost sm" href="courses.html" style="padding:6px"><svg class="icon sm"><use href="#i-back"/></svg></a>
      <div>
        <div style="font-size:13px;font-weight:650" id="tocCourse">加载中…</div>
        <div class="tiny muted" id="tocMeta"></div>
      </div>
    </div>
    <h4>章节目录</h4>
    <div id="tocList"></div>
    <div style="margin-top:18px;padding:0 8px">
      <div class="tiny muted" style="margin-bottom:8px">阅读进度</div>
      <div class="bar"><i id="readProgress" style="width:0%"></i></div>
      <div class="tiny muted" style="margin-top:6px" id="readPct">0%</div>
    </div>
  </aside>

  <main class="doc" id="doc">
    <div class="doc-cover" id="cover">
      <div class="designer">TermFinale · 开发者 Lan</div>
      <span class="chip brand" id="coverChip">最近生成</span>
      <h1 id="coverTitle">正在加载…</h1>
      <p id="coverDesc"></p>
      <div class="doc-stats" id="docStats"></div>
      <div class="doc-meta" style="margin-top:14px">
        <span id="metaFile">—</span>
        <span style="margin-left:auto;display:flex;gap:6px">
          <button class="btn sm" id="searchBtn"><svg class="icon sm"><use href="#i-search"/></svg>搜索</button>
          <button class="btn sm" id="editBtn"><svg class="icon sm"><use href="#i-edit"/></svg>编辑</button>
          <button class="btn sm" id="wordBtn"><svg class="icon sm"><use href="#i-word"/></svg>Word</button>
          <button class="btn sm" id="pdfBtn"><svg class="icon sm"><use href="#i-word"/></svg>导出 PDF</button>
          <button class="btn sm" onclick="window.print()"><svg class="icon sm"><use href="#i-print"/></svg>打印</button>
          <button class="btn sm" id="themeBtn"><svg class="icon sm"><use href="#i-moon"/></svg>主题</button>
        </span>
      </div>
    </div>
    <div id="searchBar" style="display:none;margin:10px 0 0;gap:8px;align-items:center">
      <input id="searchInput" placeholder="搜索正文，回车跳转，Shift+回车向上"
        style="flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:var(--paper);color:var(--ink)">
      <button class="btn sm" id="searchClose">关闭</button>
    </div>
    <div id="content"></div>

    <div id="emptyState" style="display:none;padding:60px 0">
      <div class="card" style="padding:40px;text-align:center;max-width:560px;margin:0 auto">
        <div class="serif" style="font-size:24px;margin-bottom:8px">还没有可读的内容</div>
        <p class="muted" style="margin:0 0 20px" id="emptyHint">先为这门课生成一份讲义，再回来阅读。</p>
        <a class="btn primary" id="emptyBtn" href="generate.html">去生成 →</a>
      </div>
    </div>
  </main>

  <aside class="rail-right">
    <h4>本章速查</h4>
    <div class="rail-card"><ol id="quickList"><li class="tiny muted">加载中…</li></ol></div>
    <div class="rail-card">
      <button class="btn" id="regenChapter" style="width:100%;justify-content:center">重新生成本章</button>
      <p class="tiny muted" style="margin:8px 0 0;line-height:1.6">只重写当前这一章，其他章节不动。</p>
    </div>
    <div class="rail-card">
      <div style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin-bottom:8px">
        <svg class="icon sm" style="color:var(--brand)"><use href="#i-spark"/></svg>问 AI
      </div>
      <textarea id="railAsk" rows="3" placeholder="选中正文提问，或在这里直接问…"
        style="width:100%;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:12.5px;background:var(--paper);color:var(--ink)"></textarea>
      <button class="btn primary sm" id="railSend" style="margin-top:8px;width:100%;justify-content:center">
        <svg class="icon sm"><use href="#i-send"/></svg>发送
      </button>
    </div>
  </aside>
</div>

<nav class="mobile-tab">
  <a href="dashboard.html">首页</a>
  <a href="courses.html">课程</a>
  <a class="active">阅读</a>
  <a href="#" id="mAsk">问 AI</a>
</nav>

<div class="toolbar" id="toolbar">
  <button data-mode="explain"><svg class="icon sm"><use href="#i-bulb"/></svg>解释一下</button>
  <button data-mode="example"><svg class="icon sm"><use href="#i-spark"/></svg>举个例子</button>
  <button data-mode="quiz"><svg class="icon sm"><use href="#i-bulb"/></svg>出题考我</button>
  <button data-mode="mistake"><svg class="icon sm"><use href="#i-edit"/></svg>加入错题</button>
</div>

<aside class="drawer" id="drawer">
  <header>
    <svg class="icon" style="color:var(--brand)"><use href="#i-spark"/></svg>
    <b>AI 答疑</b>
    <button class="close" id="drawerClose"><svg class="icon sm"><use href="#i-x"/></svg></button>
  </header>
  <div class="quote" id="quote">选中一段正文，我会结合上下文解释。</div>
  <div class="answer" id="answer">你可以先选中一句话，或者直接在右侧输入问题。</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px">
      <button class="btn ghost sm" data-follow="再解释得详细一点，最好给一个例子">解释更深</button>
      <button class="btn ghost sm" data-follow="给一个期末可能考的例题，并给答案">举个例子</button>
      <button class="btn ghost sm" data-follow="用一句话总结这里最该记住的点">一句话总结</button>
    </div>
  <footer style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;gap:6px">
      <input id="followUp" placeholder="继续追问…" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:12.5px;background:var(--paper);color:var(--ink)">
      <button class="btn primary sm" id="sendFollow">发送</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn sm" id="saveNote">存为笔记</button>
      <button class="btn sm" id="copyBtn">复制</button>
      <span class="spacer"></span>
      <span class="tiny muted">回答仅供参考</span>
    </div>
  </footer>
</aside>

<button class="ask-fab" id="askFab"><svg class="icon sm"><use href="#i-spark"/></svg>问 AI</button>
<div class="toast" id="toast"></div>
<script src="assets/app.js?v=18"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var cid = params.get('course');
  var fileId = params.get('file');
  var $ = function(id){ return document.getElementById(id); };
  function toast(msg){ (window.__toast || function(){}) (msg); }

  function load(id){
    fetch(fileId ? ('/api/files/' + fileId + '/view') : ('/api/courses/' + id + '/latest')).then(function(r){ return r.json(); }).then(function(d){
      if(!d.exists){ showEmpty(d); return; }
      render(d);
    }).catch(function(){ showEmpty({ reason: '本地服务没有启动' }); });
  }

  function showEmpty(d){
    $('cover').style.display = 'none';
    $('content').style.display = 'none';
    $('emptyState').style.display = 'block';
    $('emptyHint').textContent = d.reason || '先为这门课生成一份讲义，再回来阅读。';
    $('tocList').innerHTML = '';
    $('quickList').innerHTML = '<li class="tiny muted">—</li>';
    $('tocMeta').textContent = '';
    if(d.course){
      $('emptyBtn').href = 'generate.html?course=' + d.course.id;
      $('tocCourse').textContent = d.course.name;
      $('coverTitle').textContent = d.course.name;
    }
  }

  function render(d){
    var c = d.course;
    window.TF_COURSE = c.name;
    window.TF_COURSE_ID = c.id;
    window.TF_PERSONA = c.persona || '温柔小姐姐';
    $('tocCourse').textContent = c.name;
    $('tocMeta').textContent = '目标 ' + c.target_score + ' 分 · 剩 ' + c.days_left + ' 天';
    $('coverChip').textContent = ({guide:'讲义', extract:'资料提取', exam:'训练试卷', analysis:'逻辑分析'})[d.type] || '最近生成';
    $('coverTitle').textContent = c.name;
    var typeLabel = ({guide:'讲义', extract:'资料提取', exam:'训练试卷', analysis:'逻辑分析'})[d.type] || '学习材料';
    var wishes = ['今天也向目标靠近一点', '期末稳过，会的都对', '把这一章啃下来', '慢慢来，比较快', '你现在看的，就是考点'];
    $('coverDesc').textContent = 'TermFinale 精品讲义 · ' + wishes[Math.floor(Math.random() * wishes.length)];
    $('metaFile').textContent = d.filename;
    var stats = [['本次目标', c.target_score + ' 分'], ['剩余天数', c.days_left + ' 天'],
                 ['资料', (d.materials_used || d.materials || 0) + ' 份'], ['生成', d.generated_at || '—']];
    if(!(d.type && String(d.type).indexOf('exam') >= 0)){
      stats.splice(2, 0, ['讲解人设', c.persona || '—']);
    }
    $('docStats').innerHTML = stats.map(function(x){
      return '<div><span>' + x[0] + '</span><b>' + x[1] + '</b></div>';
    }).join('');
    $('content').innerHTML = d.html;
    window.TF_PAGE_TEXT = ($('content').textContent || '').slice(0, 3000);
    window.TF_DOC_TEXT = ($('content').textContent || '').slice(0, 24000);
    var _fresh = $('content').cloneNode(true);
    $('content').parentNode.replaceChild(_fresh, $('content'));
    if(window.renderMathInElement){
      try { renderMathInElement($('content'), { delimiters: [{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}], throwOnError:false }); } catch(e){}
    }
    var toc = d.toc || [];
    buildToc(toc);
    if(location.hash){
      var target = document.getElementById(location.hash.slice(1));
      if(target) setTimeout(function(){ target.scrollIntoView(); }, 60);
    }
    var first = toc.filter(function(t){ return t.level === '2'; })[0];
    buildQuick(toc, first ? first.id : null);
  }

  function buildToc(toc){
    var box = $('tocList'); box.innerHTML = '';
    // extract/试卷没有 h2 时，用 h3 兜底，避免“本章暂无小节”
    var want = toc.some(function(t){ return t.level === '2'; }) ? '2' : '3';
    toc.forEach(function(item){
      if(item.level !== want) return;
      var a = document.createElement('a');
      a.href = '#' + item.id;
      a.textContent = item.text.replace(/^(?:核心考点|核心考點|Core Concept)[:：]\s*/, '');
      box.appendChild(a);
    });
    var links = Array.prototype.slice.call(box.querySelectorAll('a'));
    var heads = links.map(function(a){ return document.getElementById(a.getAttribute('href').slice(1)); }).filter(Boolean);
    if(!heads.length) return;
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(!en.isIntersecting) return;
          var i = heads.indexOf(en.target);
          links.forEach(function(l,j){ l.classList.toggle('active', i === j); });
          buildQuick(LAST_TOC, en.target.id);
        });
      }, { rootMargin: '-10% 0px -75% 0px' });
      heads.forEach(function(h){ io.observe(h); });
    }
    window.addEventListener('scroll', function(){
      var max = document.documentElement.scrollHeight - innerHeight;
      var pct = max > 0 ? Math.min(100, Math.round(scrollY / max * 100)) : 0;
      $('readProgress').style.width = pct + '%';
      $('readPct').textContent = pct + '%';
    }, { passive: true });
  }

  var LAST_TOC = [];
  function buildQuick(toc, chapterId){
    LAST_TOC = toc || [];
    var box = $('quickList'); box.innerHTML = '';
    var start = -1;
    for(var i = 0; i < LAST_TOC.length; i++){
      if(LAST_TOC[i].id === chapterId){ start = i; break; }
    }
    if(start < 0){
      for(var j = 0; j < LAST_TOC.length; j++){ if(LAST_TOC[j].level === '2'){ start = j; break; } }
    }
    var items = [];
    for(var k = start + 1; k < LAST_TOC.length; k++){
      if(LAST_TOC[k].level === '2') break;
      if(LAST_TOC[k].level === '3') items.push(LAST_TOC[k]);
    }
    var seen = {};
    items = items.filter(function(t){
      if(seen[t.text]) return false; seen[t.text] = 1; return true;
    });
    if(!items.length){ box.innerHTML = '<li class="tiny muted">本章暂无小节</li>'; return; }
    items.slice(0, 10).forEach(function(t){
      var li = document.createElement('li');
      var a = document.createElement('a'); a.href = '#' + t.id; a.textContent = t.text;
      li.appendChild(a); box.appendChild(li);
    });
  }

  if($('mAsk')) $('mAsk').addEventListener('click', function(e){ e.preventDefault(); if(window.TF_ASK) window.TF_ASK('', '解释这一节'); });

  var editing = false;
  $('editBtn').addEventListener('click', function(){
    editing = !editing;
    $('content').setAttribute('contenteditable', editing ? 'true' : 'false');
    $('content').style.outline = editing ? '2px dashed var(--brand)' : 'none';
    $('content').style.padding = editing ? '8px' : '0';
    this.innerHTML = editing
      ? '<svg class="icon sm"><use href="#i-edit"/></svg>保存并退出'
      : '<svg class="icon sm"><use href="#i-edit"/></svg>编辑';
    toast(editing ? '编辑模式：直接改正文，改完点「保存并退出」' : '已退出编辑（页面修改不回写服务器）');
  });

  $('searchBtn').addEventListener('click', function(){
    var bar = $('searchBar');
    bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
    if(bar.style.display === 'flex') $('searchInput').focus();
  });
  $('searchClose').addEventListener('click', function(){ $('searchBar').style.display = 'none'; });
  function clearHits(){
    document.querySelectorAll('#content mark.tf-hit').forEach(function(m){
      var t=document.createTextNode(m.textContent); m.parentNode.replaceChild(t,m);
    });
    document.getElementById('content').normalize();
  }
  function doSearch(q, back){
    clearHits(); if(!q) return 0;
    var root=document.getElementById('content');
    var walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var nodes=[], n;
    while(n=walker.nextNode()){ if(n.nodeValue && n.nodeValue.indexOf(q)>=0) nodes.push(n); }
    var first=null, count=0;
    nodes.forEach(function(node){
      var parts=node.nodeValue.split(q);
      if(parts.length<2) return;
      var frag=document.createDocumentFragment();
      parts.forEach(function(part,i){
        frag.appendChild(document.createTextNode(part));
        if(i<parts.length-1){
          var mark=document.createElement('mark'); mark.className='tf-hit'; mark.textContent=q;
          frag.appendChild(mark); if(!first) first=mark; count++;
        }
      });
      node.parentNode.replaceChild(frag,node);
    });
    if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
    return count;
  }
  $('searchInput').addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    e.preventDefault();
    var q=this.value.trim(); if(!q) return;
    var c=doSearch(q, e.shiftKey);
    if(!c) toast('没有找到「' + q + '」'); else toast('找到 ' + c + ' 处');
  });

  $('pdfBtn').addEventListener('click', function(){
    if(!cid){ toast('请从课程进入阅读器'); return; }
    var btn = this, old = btn.innerHTML;
    btn.disabled = true; btn.textContent = '生成中…';
    toast('在打印窗口选择「另存为 PDF」');
    setTimeout(function(){ window.print(); btn.disabled=false; btn.innerHTML=old; }, 200);
  });

  $('wordBtn').addEventListener('click', function(){
    var btn = this; btn.disabled = true;
    var imgs = Array.prototype.slice.call(document.querySelectorAll('#content img'));
    Promise.all(imgs.map(function(img){
      if(img.src.indexOf('data:') === 0) return Promise.resolve();
      return fetch(img.src).then(function(r){ return r.blob(); }).then(function(blob){
        return new Promise(function(res){
          var fr = new FileReader(); fr.onload = function(){ img.src = fr.result; res(); }; fr.readAsDataURL(blob);
        });
      }).catch(function(){});
    })).then(function(){
      var body = document.getElementById('content').innerHTML;
      var doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">'
        + '<head><meta charset="utf-8"><style>body{font-family:"Songti SC","SimSun",serif;font-size:14px;line-height:1.9;color:#111}'
        + 'h2{font-size:22px;border-bottom:1px solid #ddd;padding-bottom:6px}h3{font-size:16px}'
        + 'img{max-width:100%} table{border-collapse:collapse;width:100%} td,th{border:1px solid #ccc;padding:6px}</style></head>'
        + '<body>' + body + '</body></html>';
      var blob = new Blob(['\ufeff', doc], {type: 'application/msword'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (window.TF_COURSE || 'TermFinale') + '-讲义.doc';
      a.click();
      btn.disabled = false;
      toast('Word 已导出');
    });
  });


  $('content').addEventListener('dblclick', function(e){
    var el=e.target.closest('p,li,blockquote,td');
    if(!el) return;
    var text=(el.innerText||'').trim();
    if(text.length<2) return;
    if(window.TF_SELECT_TEXT){ window.TF_SELECT_TEXT(text); toast('已选中整段，可点下方按钮提问'); }
  });


  function sendFollow(){
    var q = ($('followUp').value || '').trim();
    if(!q){ toast('先写一个问题'); return; }
    if(window.TF_ASK){ window.TF_ASK(window.TF_SELECTED || window.TF_PAGE_TEXT || '', q); } else { toast('问答脚本未加载，请刷新页面'); }
    $('followUp').value = '';
  }
  $('sendFollow').addEventListener('click', sendFollow);
  $('askFab').addEventListener('click', function(){ if(window.TF_ASK) window.TF_ASK(window.TF_PAGE_TEXT || '', '这一节的重点是什么？'); });
  $('followUp').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); sendFollow(); } });

  document.querySelectorAll('[data-follow]').forEach(function(b){
    b.addEventListener('click', function(){
      if(window.TF_ASK) window.TF_ASK(window.TF_LAST_CONTEXT || '', b.dataset.follow);
    });
  });
  $('saveNote').addEventListener('click', function(){
    if(!cid){ toast('请从课程进入阅读器再存笔记'); return; }
    var quote = $('quote').textContent.trim();
    var answer = $('answer').textContent.trim();
    if(!answer || answer.length < 5){ toast('先提问再存笔记'); return; }
    var active = document.querySelector('.toc a.active');
    fetch('/api/notes', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ course_id: +cid, chapter: active ? active.textContent.trim() : '',
                             question: quote, answer: answer }) })
      .then(function(r){ return r.json(); })
      .then(function(){ toast('已存为笔记'); })
      .catch(function(){ toast('保存失败'); });
  });

  $('regenChapter').addEventListener('click', function(){
    if(!cid || !window.TF_COURSE_ID){ toast('请从课程进入阅读器'); return; }
    var btn = this;
    var active = document.querySelector('.toc a.active');
    var title = active ? active.textContent.trim() : '';
    var level2 = (LAST_TOC || []).filter(function(t){ return t.level === '2'; });
    var idx = 0;
    if(title){
      for(var i = 0; i < level2.length; i++){
        if(level2[i].text.replace(/^核心考点[:：]\s*/, '') === title){ idx = i; break; }
      }
    }
    btn.disabled = true; btn.textContent = '提交中…';
    fetch('/api/jobs', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ course_id: window.TF_COURSE_ID, task: 'chapter',
        options: { chapter_index: idx, mode: 'key', persona: window.TF_PERSONA || '温柔小姐姐' } }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var timer = setInterval(function(){
          fetch('/api/jobs/' + d.job_id).then(function(r){ return r.json(); }).then(function(snap){
            if(snap.status === 'done'){
              clearInterval(timer); btn.textContent = '完成，刷新中…'; setTimeout(function(){ location.reload(); }, 600);
            } else if(snap.status === 'error'){
              clearInterval(timer); btn.disabled = false; btn.textContent = '重试'; toast(snap.error || '重写失败');
            } else {
              btn.textContent = '重写中 ' + Math.round((snap.progress || 0) * 100) + '%';
            }
          });
        }, 1500);
      })
      .catch(function(){ btn.disabled = false; btn.textContent = '重试'; toast('提交失败'); });
  });

  if(cid){ load(cid); }
  else {
    fetch('/api/courses').then(function(r){ return r.json(); }).then(function(list){
      if(list && list.length){ load(list[0].id); } else { showEmpty({}); }
    }).catch(function(){ showEmpty({ reason: '本地服务没有启动' }); });
  }
})();
</script>
  <script src="assets/i18n.js?v=1"></script>
</body>

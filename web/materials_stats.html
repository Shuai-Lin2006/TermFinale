<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="assets/appearance-boot.js?v=2"></script>
<title>资料统计 · TermFinale</title>
<link rel="stylesheet" href="assets/app.css?v=23">
<link rel="stylesheet" href="assets/premium.css?v=4">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="brand-mark">TF</span><div><div class="brand-name">TermFinale</div><div class="brand-sub">期末复习工作台</div></div></div>
    <nav class="nav"></nav>
    <div class="rail-foot"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <a class="btn ghost sm" href="dashboard.html">← 返回</a>
      <div class="spacer"></div>
      <a class="btn primary sm" href="courses.html">管理课程</a>
    </header>

    <div class="page">
      <div class="page-head">
        <div>
          <div class="eyebrow">Library</div>
          <h1 class="page-title">资料统计</h1>
          <div class="page-sub" id="sub">按课程汇总</div>
        </div>
      </div>
      <div class="tf-metrics">
        <div class="tf-metric"><b id="mFiles">0</b><span>份资料</span></div>
        <div class="tf-metric"><b id="mSize">0 MB</b><span>占用空间</span></div>
        <div class="tf-metric"><b id="mMissing">0</b><span>份缺失</span></div>
      </div>
      <div id="content"><div class="tiny muted">加载中…</div></div>
    </div>
  </main>
</div>

<script src="assets/app.js?v=23"></script>
<script src="assets/i18n.js?v=2"></script>
<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function load(){
    fetch('/api/materials/all').then(function(r){ return r.json(); }).then(function(list){
      list = list || [];
      var groups = {};
      list.forEach(function(m){
        var g = groups[m.course_id] || (groups[m.course_id] = {name: m.course, items: []});
        g.items.push(m);
      });
      var totalSize = list.reduce(function(a,m){ return a + (m.size_kb || 0); }, 0);
      var missing = list.filter(function(m){ return !m.exists; }).length;
      document.getElementById('mFiles').textContent = list.length;
      document.getElementById('mSize').textContent = Math.round(totalSize / 1024) + ' MB';
      document.getElementById('mMissing').textContent = missing;
      document.getElementById('sub').textContent =
        list.length + ' 份资料 · ' + Object.keys(groups).length + ' 门课 · ' + Math.round(totalSize / 1024) + ' MB';

      if(!list.length){
        document.getElementById('content').innerHTML =
          '<div class="tf-empty"><div class="eyebrow" style="margin-bottom:10px">Empty</div><h2>还没有资料</h2><p>去课程里上传第一份资料。</p><a class="btn primary" href="courses.html">我的课程</a></div>';
        return;
      }
      var out = '';
      Object.keys(groups).forEach(function(cid){
        var g = groups[cid];
        var size = g.items.reduce(function(a,m){ return a + (m.size_kb || 0); }, 0);
        out += '<div class="tf-section-head"><h2>' + esc(g.name) + '</h2>'
          + '<a class="link" href="upload.html?course=' + cid + '">管理资料 →</a></div>';
        out += '<div class="card" style="padding:4px 18px;margin-bottom:8px">';
        out += g.items.map(function(m){
          return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)">'
            + '<span class="chip' + (m.role === 'core' ? ' brand' : '') + '">' + (m.role === 'core' ? '重点' : '辅助') + '</span>'
            + '<span style="flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(m.filename) + '</span>'
            + '<span class="tiny muted">' + (m.size_kb || 0) + ' KB · 权重 ' + (m.weight || 3) + '</span>'
            + (m.exists ? '' : '<span class="chip" style="color:var(--danger)">缺失</span>')
            + '</div>';
        }).join('');
        out += '</div>';
        out += '<div class="tf-mini" style="margin:-4px 0 8px">' + g.items.length + ' 份 · ' + Math.round(size / 1024) + ' MB</div>';
      });
      document.getElementById('content').innerHTML = out;
    }).catch(function(){
      document.getElementById('sub').textContent = '本地服务未启动，请重新打开 TermFinale。';
    });
  }
  load();
})();
</script>
<script src="assets/appearance.js?v=2"></script>
<script src="assets/ai-global.js?v=2"></script>
</body>
</html>

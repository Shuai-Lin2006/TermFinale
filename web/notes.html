<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="assets/appearance-boot.js?v=2"></script>
<title>笔记 · TermFinale</title>
<link rel="stylesheet" href="assets/app.css?v=23">
<link rel="stylesheet" href="assets/premium.css?v=3">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="brand-mark">TF</span><div><div class="brand-name">TermFinale</div><div class="brand-sub">期末复习工作台</div></div></div>
    <nav class="nav"></nav>
    <div class="rail-foot"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <a class="btn ghost sm" href="dashboard.html">← 返回</a>
      <div class="spacer"></div>
      <select class="select" id="courseFilter" style="min-width:140px"><option value="">全部课程</option></select>
    </header>

    <div class="page">
      <div class="page-head">
        <div>
          <div class="eyebrow">Notes</div>
          <h1 class="page-title">笔记</h1>
          <div class="page-sub" id="sub">阅读时选中提问，点「存为笔记」就会出现在这里</div>
        </div>
      </div>
      <div class="tf-metrics">
        <div class="tf-metric"><b id="mNotes">0</b><span>条笔记</span></div>
        <div class="tf-metric"><b id="mCourses">0</b><span>门课程</span></div>
        <div class="tf-metric"><b id="mChars">0</b><span>总字数</span></div>
      </div>
      <div id="list" class="tf-grid-2"></div>
      <div id="empty" class="tf-empty" style="display:none">
        <div class="eyebrow" style="margin-bottom:10px">Empty</div>
        <h2>还没有笔记</h2>
        <p>在阅读器里选中一段话，问 AI，然后把回答存下来。</p>
        <a class="btn primary" href="courses.html">去阅读 →</a>
      </div>
    </div>
  </main>
</div>

<script src="assets/app.js?v=23"></script>
<script src="assets/i18n.js?v=2"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function rich(v){ return esc(v).replace(/\n/g,'<br>'); }
  function load(){
    var cid = $('courseFilter').value;
    fetch('/api/notes' + (cid ? '?course_id=' + cid : '')).then(function(r){ return r.json(); }).then(function(list){
      list = list || [];
      $('sub').textContent = list.length ? ('共 ' + list.length + ' 条笔记') : '阅读时选中提问，点「存为笔记」就会出现在这里';
      $('mNotes').textContent = list.length;
      $('mCourses').textContent = Object.keys(list.reduce(function(a,n){ a[n.course]=1; return a; }, {})).length;
      $('mChars').textContent = list.reduce(function(a,n){ return a + String(n.answer || '').length; }, 0);
      if(!list.length){ $('list').innerHTML = ''; $('empty').style.display = 'block'; return; }
      $('empty').style.display = 'none';
      $('list').innerHTML = list.map(function(n){
        var answer = String(n.answer || '');
        return '<article class="tf-course note-card" style="min-height:0">'
          + '<div class="tf-course-top"><span class="chip">' + esc(n.course) + '</span>'
          + '<span class="tiny muted">' + esc(n.created_at || '') + '</span></div>'
          + '<h3 style="font-size:16px">' + esc(n.chapter || '笔记') + '</h3>'
          + '<div class="meta" style="display:block;color:var(--ink-2)">' + rich(n.question) + '</div>'
          + '<div class="answer" style="font-size:13px;line-height:1.85;color:var(--muted);margin-top:6px">' + rich(answer) + '</div>'
          + '<div class="spacer"></div>'
          + '<div class="tf-course-foot"><span class="tf-mini">' + answer.length + ' 字</span>'
          + '<span style="display:flex;gap:6px">'
          + '<button class="btn ghost sm" data-expand="1">展开</button>'
          + '<button class="btn ghost sm" data-del="' + n.id + '">删除</button></span></div>'
          + '</article>';
      }).join('');
      document.querySelectorAll('.note-card [data-expand]').forEach(function(b){
        b.addEventListener('click', function(){
          var card = b.closest('.note-card');
          var open = card.classList.toggle('open');
          b.textContent = open ? '收起' : '展开';
        });
      });
      document.querySelectorAll('[data-del]').forEach(function(b){
        b.addEventListener('click', function(){
          if(!confirm('删除这条笔记？')) return;
          fetch('/api/notes/' + b.dataset.del, {method:'DELETE'}).then(load);
        });
      });
    }).catch(function(){ $('sub').textContent = '本地服务未启动，请重新打开 TermFinale。'; });
  }
  fetch('/api/courses').then(function(r){ return r.json(); }).then(function(list){
    (list || []).forEach(function(c){
      var o = document.createElement('option'); o.value = c.id; o.textContent = c.name;
      $('courseFilter').appendChild(o);
    });
  }).catch(function(){});
  $('courseFilter').addEventListener('change', load);
  load();
})();
</script>
<script src="assets/appearance.js?v=2"></script>
<script src="assets/ai-global.js?v=2"></script>
</body>
</html>

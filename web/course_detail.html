<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("tf-theme")||"dark"}catch(e){}</script>
<title>课程详情 · TermFinale</title><link rel="stylesheet" href="assets/app.css?v=22">
<link rel="stylesheet" href="assets/premium.css?v=1"></head>
<body class="detail-page">
<div class="app">
  <aside class="rail"><div class="brand"><div class="brand-mark">TF</div><div><div class="brand-name">TermFinale</div><div class="brand-sub">期末冲刺工作台</div></div></div><nav class="nav" id="nav"></nav></aside>
  <main class="main">
    <div class="topbar"><div class="crumb" id="crumb">课程</div><div class="spacer"></div></div>
    <section class="card detail-hero" id="head"><div class="tiny muted">加载中…</div></section>
    <div class="section-head"><h2>资料</h2><div class="line"></div><a class="btn ghost sm" id="upBtn" href="#">上传资料</a></div>
    <section class="course-grid detail-grid" id="mats"></section>
    <div class="section-head"><h2>生成物</h2><div class="line"></div><a class="btn ghost sm" id="genBtn" href="#">再生成</a></div>
    <section class="course-grid detail-grid" id="files"></section>
  </main>
</div>
<script src="assets/i18n.js?v=1"></script>
<script src="assets/app.js?v=22"></script>
<script>
(function(){
  var cid=new URLSearchParams(location.search).get('course');
  var EN=(localStorage.getItem('tf-lang')||'zh').indexOf('en')===0;
  var P_EN={'温柔小姐姐':'Gentle tutor','老师':'Teacher','学术AI':'Academic AI','阳光小哥哥':'Sunny tutor','暴力极客':'Hardcore geek'};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  if(!cid){document.getElementById('head').innerHTML='缺少课程编号';return;}
  fetch('/api/courses/'+cid).then(function(r){return r.json();}).then(function(c){
    document.getElementById('crumb').textContent=c.name;
    document.getElementById('upBtn').href='upload.html?course='+cid;
    document.getElementById('genBtn').href='generate.html?course='+cid;
    document.getElementById('head').innerHTML=
      '<div class="course-top"><span class="chip">'+(c.days_left<=3?'临近考试':'进行中')+'</span>'+
      '<span class="tiny muted">'+esc(c.school)+' · '+esc(c.major)+'</span></div>'+
      '<h1 class="page-title" style="margin:10px 0 4px">'+esc(c.name)+'</h1>'+
      '<div class="tiny muted" style="margin-bottom:16px">剩余 '+c.days_left+' 天 · 目标 '+c.target_score+' 分 · '+c.credits+' 学分</div>'+
      '<div class="stat-row" style="gap:26px"><div class="stat"><b>'+c.target_score+'</b><span>目标分</span></div>'+
      '<div class="stat"><b>'+c.days_left+'</b><span>剩余天数</span></div>'+
      '<div class="stat"><b>'+c.credits+'</b><span>学分</span></div>'+
      '<div class="stat"><b>'+c.difficulty+'</b><span>自设难度</span></div>'+
      '<div class="stat"><b>'+c.foundation+'</b><span>自身基础</span></div>'+
      '<div class="stat"><b>'+esc(c.persona||'—')+'</b><span>讲解人设</span></div></div>';
    document.getElementById('mats').innerHTML=(c.materials||[]).map(function(m){
      return '<article class="card course"><div class="course-top"><span class="chip">'+esc(m.role||m.type||'资料')+'</span>'+
        '<span class="tiny muted">'+(m.exists?'可用':'缺失')+'</span></div>'+
        '<h3 style="font-size:14px;margin:10px 0 6px;word-break:break-all">'+esc(m.filename)+'</h3>'+
        '<div class="tiny muted">'+Math.round((m.size_kb||0))+' KB · 权重 '+ (m.weight||3) +'</div>'+
        '<div class="course-foot"><span></span><a class="btn ghost sm" href="generate.html?course='+cid+'">去生成</a></div></article>';
    }).join('') || '<div class="card course">还没有资料</div>';
  });
  fetch('/api/courses/'+cid+'/files').then(function(r){return r.json();}).then(function(d){
    var labels={guide:'讲义',extract:'资料提取',exam:'训练试卷',analysis:'逻辑分析'};
    document.getElementById('files').innerHTML=(d.files||[]).map(function(f){
      var m=f.meta||{}; if(!Object.keys(m).length) bits=[]; var _legacy=(EN?'Legacy output, no metadata · ':'旧生成物，未记录语言/人设参数 · '); var bits=[];
      if(m.lang&&m.lang!=='中文')bits.push(m.lang); if(m.persona)bits.push(EN?(P_EN[m.persona]||m.persona):m.persona);
      if(m.mode)bits.push(m.mode==='key'?(EN?'Key':'精简'):(EN?'Full':'全量'));
      if(m.extract_type)bits.push({points:'考点',nouns:'名词',questions:'原题'}[m.extract_type]||m.extract_type);
      if(m.train_type)bits.push({original:'原题改数',variant:'原题变式',predict:'预测仿真',mock:'模拟练习'}[m.train_type]||m.train_type);
      return '<article class="card course"><div class="course-top"><span class="chip">'+(labels[f.type]||f.type)+'</span>'+
        '<span class="tiny muted">'+new Date(f.created_at*1000).toLocaleDateString()+'</span></div>'+
        '<h3 style="font-size:14px;margin:10px 0 6px">'+esc(f.filename.replace(/\.html$/i,''))+'</h3>'+
        '<div class="tiny muted">'+(bits.length?bits.join(' · ')+' · ':_legacy)+'Files '+ (f.materials_used||1)+'</div>'+
        '<div class="course-foot"><span></span>'+(f.exists?'<a class="btn sm" href="reader.html?course='+cid+'&file='+f.id+'">打开</a>':'')+'</div></article>';
    }).join('') || '<div class="card course">还没有生成物</div>';
  });
})();
</script>
</body></html>

<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="graphite">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>练习与错题 · TermFinale</title><link rel="stylesheet" href="assets/app.css?v=13"></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13a9 9 0 1 1-10-10 7 7 0 0 0 10 10Z"/></symbol>
</svg>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark">TF</div><div><div class="brand-name">TermFinale</div><div class="brand-sub">期末冲刺工作台</div></div></div>
    <nav class="nav">
      <a class="nav-item" href="dashboard.html"><svg class="icon"><use href="#i-home"/></svg>今日冲刺</a>
      <a class="nav-item" href="courses.html"><svg class="icon"><use href="#i-book"/></svg>我的课程</a>
      <a class="nav-item active"><svg class="icon"><use href="#i-spark"/></svg>练习与错题</a>
      <a class="nav-item" href="upload.html"><svg class="icon"><use href="#i-layers"/></svg>资料库</a>
      <a class="nav-item" href="notes.html"><svg class="icon"><use href="#i-book"/></svg>笔记</a>
      <a class="nav-item" href="settings.html"><svg class="icon"><use href="#i-gear"/></svg>设置</a>
    </nav>
    <div class="rail-foot"><div class="user"><div class="avatar">林</div><div><div style="font-size:13px;font-weight:600">林同学</div><div class="tiny muted">大二 · 环境工程</div></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="search"><svg class="icon sm"><use href="#i-spark"/></svg>练习与错题</div>
      <div class="spacer"></div>
      <span class="chip" id="apiState">连接中…</span>
      <button class="btn ghost sm" id="themeBtn2"><svg class="icon sm"><use href="#i-moon"/></svg></button>
    </header>
    <div class="page">
      <div class="page-head"><div><h1 class="page-title">练习与错题</h1>
        <div class="page-sub">先做套卷，再把错的题收进来，按遗忘曲线复习</div></div>
        <div class="spacer"></div><a class="btn primary" href="generate.html">生成一套试卷</a></div>

      <section class="hero" style="grid-template-columns:1fr 1fr 1fr">
        <div class="card" style="padding:20px"><div class="tiny muted">训练试卷</div>
          <div class="serif" style="font-size:34px;margin-top:6px" id="statExams">—</div></div>
        <div class="card" style="padding:20px"><div class="tiny muted">笔记</div>
          <div class="serif" style="font-size:34px;margin-top:6px" id="statNotes">—</div></div>
        <div class="card" style="padding:20px"><div class="tiny muted">待复习</div>
          <div class="serif" style="font-size:34px;margin-top:6px" id="statDue">—</div></div>
      </section>

      <div class="section-head"><h2>训练试卷</h2><div class="line"></div></div>
      <div id="exams" class="course-grid"></div>

      <div class="section-head"><h2>错题本</h2><div class="line"></div><span class="tiny muted" id="dueTip"></span></div>
      <div id="mistakes"></div>
    </div>
  </main>
</div>

<div class="modal-mask" id="quizModal">
  <div class="modal" style="width:720px">
    <h3 id="quizTitle">判分练习</h3>
    <p class="sub" id="quizSub">选择题自动判分，做错的题自动进错题本</p>
    <div id="quizBody" style="max-height:60vh;overflow:auto;padding-right:6px"></div>
    <div id="quizResult" class="tiny" style="margin-top:10px"></div>
    <div class="modal-actions">
      <button class="btn" id="quizClose">关闭</button>
      <button class="btn primary" id="quizSubmit">提交判分</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="assets/app.js?v=13"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  fetch('/api/practice').then(function(r){return r.json();}).then(function(d){
    $('apiState').textContent='已连接';
    $('statExams').textContent=d.exams.length;
    $('statNotes').textContent=d.notes;
    if(d.mistakes !== undefined){ $('statDue').textContent = d.due + ' / ' + d.mistakes; }
    if(!d.exams.length){ $('exams').innerHTML='<article class="card course"><div class="meta">还没有试卷，去生成一套。</div><div class="course-foot"><a class="btn sm" href="generate.html">去生成</a></div></article>'; return; }
    $('exams').innerHTML=d.exams.map(function(e){
      return '<article class="card hover course"><div class="course-top"><span class="chip">'+e.course+'</span>'+
        '<span class="tiny muted">'+(e.created_at||'')+'</span></div><h3>'+e.filename.replace(/\.html$/,'')+'</h3>'+
        '<div class="meta">'+(e.has_md?'可在阅读器打开':'旧文件，需重新生成')+'</div>'+
        '<div class="course-foot"><span class="tiny muted">'+(e.has_md?'可判分':'—')+'</span>'+
        '<span style="display:flex;gap:6px">'+
        (e.has_md?'<button class="btn sm" data-quiz="'+e.id+'" data-course="'+e.course_id+'">判分练习</button>':'')+
        '<a class="btn ghost sm" href="reader.html?course='+e.course_id+'">打开</a></span></div></article>';
    }).join('');
  }).catch(function(){ $('apiState').textContent='未连接'; });

  var quizQuestions = [];
  var quizCourse = 7;
  function openQuiz(id, courseId){
    quizCourse = courseId || quizCourse;
    fetch('/api/exams/'+id+'/quiz').then(function(r){return r.json();}).then(function(d){
      if(!d.exists || !d.questions.length){ if(window.__toast) window.__toast(d.reason || '这套卷子没有可判分的选择题'); return; }
      quizQuestions = d.questions;
      $('quizTitle').textContent = d.filename.replace(/\.(html|md)$/,'');
      $('quizSub').textContent = '共 ' + d.questions.length + ' 道选择题 · 选完提交自动判分';
      $('quizResult').textContent = '';
      $('quizBody').innerHTML = d.questions.map(function(q, i){
        return '<div style="margin-bottom:16px" data-q="'+i+'"><div style="font-size:13.5px;line-height:1.8;margin-bottom:6px">'+
          q.no + '. ' + q.stem + '</div>' +
          Object.keys(q.options).map(function(k){
            return '<label class="tiny" style="display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer">'+
              '<input type="radio" name="q'+i+'" value="'+k+'" style="accent-color:var(--brand);margin-top:3px">'+
              '<span><b>'+k+'.</b> '+q.options[k]+'</span></label>';
          }).join('') + '</div>';
      }).join('');
      $('quizModal').classList.add('show');
    });
  }

  $('quizSubmit').addEventListener('click', function(){
    var correct = 0, wrong = [];
    quizQuestions.forEach(function(q, i){
      var sel = document.querySelector('input[name="q'+i+'"]:checked');
      var val = sel ? sel.value : '';
      if(val === q.answer) correct++;
      else wrong.push({q: q, picked: val});
    });
    var total = quizQuestions.length;
    $('quizResult').innerHTML = '<b>得分：' + correct + ' / ' + total + '</b>' +
      (wrong.length ? (' · ' + wrong.length + ' 题已加入错题本') : ' · 全对');
    $('quizResult').style.color = correct === total ? 'var(--ok)' : 'inherit';
    wrong.forEach(function(w){
      fetch('/api/mistakes', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ course_id: quizCourse, question: w.q.no + '. ' + w.q.stem,
          answer: w.q.options[w.q.answer] || '',
          note: '正确答案 ' + w.q.answer + '，你选了 ' + (w.picked || '未作答') }) }).catch(function(){});
    });
    setTimeout(loadMistakes, 600);
  });
  $('quizClose').addEventListener('click', function(){ $('quizModal').classList.remove('show'); });
  $('quizModal').addEventListener('click', function(e){ if(e.target === this) this.classList.remove('show'); });
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('[data-quiz]');
    if(b) openQuiz(b.dataset.quiz, +b.dataset.course);
  });

  function loadMistakes(){
    fetch('/api/mistakes').then(function(r){return r.json();}).then(function(list){
      var box=$('mistakes');
      var due=list.filter(function(m){return m.due && !m.mastered;}).length;
      $('dueTip').textContent = list.length ? ('共 ' + list.length + ' 题 · 今天该复习 ' + due + ' 题') : '';
      if(!list.length){
        box.innerHTML='<div class="card"><div style="padding:36px;text-align:center">'+
          '<div class="serif" style="font-size:20px;margin-bottom:6px">还没有错题</div>'+
          '<p class="muted" style="margin:0 0 16px">阅读时选中题目，点「加入错题」；之后按 1/2/4/7 天提醒复习。</p>'+
          '<a class="btn" href="courses.html">去阅读</a></div></div>';
        return;
      }
      box.innerHTML=list.map(function(m){
        var badge = m.mastered ? '已掌握' : (m.due ? '今天复习' : ('第 ' + (m.stage+1) + ' 轮'));
        return '<article class="card course" style="margin-bottom:12px"><div class="course-top">'+
          '<span class="chip">'+m.course+'</span><span class="tiny muted">'+badge+' · 下次 '+m.due_at+'</span></div>'+
          '<p style="font-size:13.5px;line-height:1.85;margin:10px 0">'+m.question+'</p>'+
          (m.note ? '<p class="tiny muted">'+m.note+'</p>' : '')+
          '<div class="course-foot"><span class="tiny muted">第 '+(m.stage+1)+' 轮</span>'+
          '<span style="display:flex;gap:6px">'+
          '<button class="btn sm" data-known="'+m.id+'">记住了</button>'+
          '<button class="btn ghost sm" data-forgot="'+m.id+'">忘了</button>'+
          '<button class="btn ghost sm" data-del="'+m.id+'">删除</button></span></div></article>';
      }).join('');
      box.querySelectorAll('[data-known]').forEach(function(b){ b.addEventListener('click', function(){ review(b.dataset.known, true); }); });
      box.querySelectorAll('[data-forgot]').forEach(function(b){ b.addEventListener('click', function(){ review(b.dataset.forgot, false); }); });
      box.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click', function(){
        fetch('/api/mistakes/'+b.dataset.del,{method:'DELETE'}).then(loadMistakes); }); });
    });
  }
  function review(id, known){
    fetch('/api/mistakes/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({known: known})}).then(loadMistakes);
  }
  loadMistakes();
})();
</script>
</body></html>

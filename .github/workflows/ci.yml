name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes matplotlib numpy

      - name: Compile all
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('.').rglob('*.py') if '.venv' not in str(p) and 'legacy' not in str(p) and 'build' not in str(p) and 'dist' not in str(p)]"

      - name: Static check
        run: python -m pyflakes main.py launcher.py desktop.py server/app.py services core models tools/evaluate.py tools/build.py tools/restore_backup.py

      - name: Unit tests (all modules)
        env:
          TERMFINALE_SKIP_PROJECT_ENV: "1"
        run: python -m unittest discover -s tests -v

      - name: Server import smoke
        env:
          TERMFINALE_SKIP_PROJECT_ENV: "1"
          TERMFINALE_HOME: ${{ runner.temp }}/tf_ci_home
        run: python -c "import server.app; print('server import ok')"

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Compile all
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('.').rglob('*.py') if '.venv' not in str(p) and 'legacy' not in str(p) and 'build' not in str(p) and 'dist' not in str(p)]"

      - name: Static check
        run: python -m pyflakes main.py launcher.py services core models tools/evaluate.py

      - name: Unit tests
        run: |
          python -m tests.test_weights
          python -m tests.test_pipeline
          python -m tests.test_maintenance
          python -m tests.test_config

      - name: Smoke test
        run: python tools/smoke.py

name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python tools/build.py

      - name: Package zip
        shell: powershell
        run: |
          $ver = (Get-Content VERSION).Trim()
          Compress-Archive -Path "dist\TermFinale\*" -DestinationPath "TermFinale-$ver-win-x64.zip" -Force

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content VERSION).Trim()
          $tag = "v$ver"
          $zip = "TermFinale-$ver-win-x64.zip"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip --clobber
          } else {
            Write-Host "Release $tag not found; artifact kept only."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: termfinale-windows
          path: TermFinale-*-win-x64.zip
          retention-days: 30

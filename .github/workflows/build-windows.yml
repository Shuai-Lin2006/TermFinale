name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python tools/build.py

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\TermFinale\TermFinale.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8907/api/health" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          $proc = Get-Process TermFinale -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "== window title ==" $proc.MainWindowTitle
          Write-Host "== server_error.log =="
          Get-Content "$env:LOCALAPPDATA\TermFinale\logs\server_error.log" -ErrorAction SilentlyContinue
          Write-Host "== boot log =="
          Get-Content "$env:TEMP\termfinale_boot.log" -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "packaged app health check failed" }

      - name: Package zip
        shell: powershell
        run: |
          $ver = (Get-Content VERSION).Trim()
          Compress-Archive -Path "dist\TermFinale\*" -DestinationPath "TermFinale-$ver-win-x64.zip" -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\TermFinale.iss"

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content VERSION).Trim()
          $tag = "v$ver"
          $zip = "TermFinale-$ver-win-x64.zip"
          $setup = "dist\TermFinale-$ver-win-x64-setup.exe"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip $setup --clobber
          } else {
            Write-Host "Release $tag not found; artifact kept only."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: termfinale-windows
          path: |
            TermFinale-*-win-x64.zip
            dist/TermFinale-*-win-x64-setup.exe
          retention-days: 30
